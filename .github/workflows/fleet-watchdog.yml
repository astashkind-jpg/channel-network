name: Telegram fleet watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-fleet-watchdog
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check all four repositories (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fleet_watchdog.py
