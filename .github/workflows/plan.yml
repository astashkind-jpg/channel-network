name: План на завтра

on:
  schedule:
    - cron: "37 15 * * *"   # 18:37 по Москве — сводка приходит вечером
  workflow_dispatch:
    inputs:
      date:
        description: "Дата плана YYYY-MM-DD (пусто — завтра)"
        required: false
      force:
        description: "Пересоздать, если план уже есть"
        type: boolean
        default: false

concurrency:
  group: plan
  cancel-in-progress: false

jobs:
  run:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: План и сводка
        run: python -m bot.main plan ${{ inputs.date && format('--date {0}', inputs.date) || '' }} ${{ inputs.force && '--force' || '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          STORAGE_CHAT_ID: ${{ secrets.STORAGE_CHAT_ID }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
          YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "network-bot"
          git config user.email "network-bot@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "state: ${{ github.workflow }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs && git push -q && exit 0
            sleep $((i * 5))
          done
          echo "не удалось сохранить состояние" && exit 1
