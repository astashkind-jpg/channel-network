# Каналы сети. Канал работает, когда enabled: true И заполнен chat_id.
#
# chat_id      — @username канала или числовой id (-100…). Бот должен быть админом канала.
# invite_link  — ссылка для кросс-пиара (лучше отдельная пригласительная ссылка, чтобы считать переходы).
# cluster      — main или adult. Кросс-пиар и каталог только внутри своего кластера.
# model        — модель Yandex AI Studio для этого канала; пусто — default_model из network.yaml.
#                Варианты: deepseek-v4.1-flash, qwen3.6-35b-a3b, aliceai-llm, aliceai-llm-flash, yandexgpt-5.1
# auto_approve — false: пост выйдет только после вашего ✅ (без автопубликации).
# windows      — окна публикации по Москве; время внутри окна случайное. Сколько окон — столько постов в день.
# video_sources — каналы-источники для репоста видео (со ссылкой на источник). Пусто — видео-рубрика
#                 заменяется текстовой.
# rubrics.slots — номера окон (с 0), в которые ставится рубрика.
# image_source — free (фотостоки) или generate (YandexART, платно); пусто — как в network.yaml.
# image_category — категория Pixabay для запасного поиска (transportation, food, animals, nature,
#                  buildings, industry, places, travel…); пусто — без категории.
# image_fallback — тематическое фото канала, если точной картинки к посту не нашлось.

channels:

  # ───────────── 1. Авто ─────────────
  - key: auto
    enabled: true
    title: "Под капотом"
    chat_id: "-1004117326263"
    invite_link: "https://t.me/pod_kapotom_avto"
    tagline: "авто-лайфхаки и ремонт своими руками"
    emoji: "🚗"
    cluster: main
    model: ""
    auto_approve: true
    image_source: ""
    image_category: "transportation"
    image_fallback: "car engine bay"
    windows: ["08:00-09:30", "13:00-14:30", "19:00-21:00"]
    video_sources: []
    persona: |
      Ты — автор Telegram-канала «Под капотом» для обычных водителей. Ты опытный автомеханик
      с чувством юмора: объясняешь просто, без снобизма, предупреждаешь о рисках и ошибках.
      Аудитория — мужчины и женщины 25–55 лет, ездят на массовых машинах.
    rubrics:
      - name: "Лайфхак"
        weight: 3
        prompt: "Один практичный лайфхак для водителя: проблема, простое решение, чем оно полезно. Без опасных советов."
      - name: "Сезонный уход"
        weight: 1
        prompt: "Совет по уходу за машиной, актуальный для этого времени года (учитывай дату). Конкретно: что проверить, как и почему."
      - name: "Разбор поломки"
        weight: 1
        prompt: "Разбор типичной неисправности: симптомы, вероятные причины, что можно сделать самому и когда ехать в сервис."
      - name: "Видео"
        type: video
        weight: 2

  # ───────────── 2. Ремонт / DIY ─────────────
  - key: diy
    enabled: true
    title: "Руки из плеч"
    chat_id: "-1003865684905"
    invite_link: "https://t.me/ruki_iz_plech_diy"
    tagline: "ремонт, самоделки и хитрости мастеров"
    emoji: "🔨"
    cluster: main
    model: ""
    auto_approve: true
    image_source: ""
    image_category: "buildings"
    image_fallback: "workshop tools"
    windows: ["08:30-10:00", "13:30-15:00", "19:30-21:30"]
    video_sources: []
    persona: |
      Ты — автор канала «Руки из плеч» про ремонт квартиры, дачи и самоделки. Пишешь как мастер
      с 20-летним опытом: практично, с примерами, иногда с иронией над типичными ошибками.
    rubrics:
      - name: "Хитрость мастера"
        weight: 3
        prompt: "Одна хитрость из ремонта или работы с инструментом, которую знают профи, а новички — нет."
      - name: "Ошибка ремонта"
        weight: 1
        prompt: "Типичная ошибка в ремонте: почему её делают, к чему приводит, как правильно."
      - name: "Самоделка"
        weight: 1
        prompt: "Идея простой самоделки для дома или дачи: что понадобится и как сделать в 3–5 шагах."
      - name: "Видео"
        type: video
        weight: 2

  # ───────────── 3. Отношения 18+ (отдельный кластер) ─────────────
  - key: intimacy
    enabled: true
    title: "Между нами"
    chat_id: "-1004434056933"
    invite_link: "https://t.me/mezhdu_nami_18"
    tagline: "об отношениях и сексуальности без стеснения"
    emoji: "🍒"
    cluster: adult
    model: ""
    auto_approve: true
    image_source: ""
    image_category: ""
    image_fallback: "couple love"
    windows: ["09:00-10:30", "14:00-16:00", "21:00-23:00"]
    video_sources: []
    persona: |
      Ты — автор канала 18+ «Между нами» о сексуальности и отношениях взрослых людей. Тон — откровенный,
      тёплый и с юмором, но просветительский: опираешься на психологию и сексологию, развенчиваешь мифы,
      говоришь о согласии, здоровье и комфорте обоих партнёров. Не описываешь сексуальные сцены и не
      пишешь натуралистично; никакого контента о несовершеннолетних, насилии или без согласия.
    rubrics:
      - name: "Факт"
        weight: 2
        prompt: "Интересный и проверенный факт о сексуальности, физиологии или влечении — с коротким объяснением, почему так."
      - name: "Миф или правда"
        weight: 2
        prompt: "Распространённый миф о сексе или отношениях и что о нём говорят специалисты."
      - name: "Психология пары"
        weight: 2
        prompt: "Совет для пары: как говорить о желаниях, сохранять близость, решать типичный конфликт."
      - name: "Частый вопрос"
        weight: 1
        prompt: "Типичный вопрос, который люди стесняются задать (сформулируй его), и честный ответ специалиста."

  # ───────────── 4. Кулинария / ПП ─────────────
  - key: food
    enabled: true
    title: "Вкусно и полезно"
    chat_id: "-1004485379277"
    invite_link: "https://t.me/vkusno_i_polezno_nam"
    tagline: "простые рецепты и правильное питание"
    emoji: "🥗"
    cluster: main
    model: ""
    auto_approve: true
    image_source: ""
    image_category: "food"
    image_fallback: "healthy food"
    windows: ["07:30-09:00", "11:30-13:00", "17:00-19:00"]
    video_sources: []
    persona: |
      Ты — автор кулинарного канала «Вкусно и полезно». Пишешь рецепты из обычных продуктов
      из магазина у дома, с понятными шагами. Не обещаешь похудения и лечебного эффекта.
    rubrics:
      - name: "Рецепт дня"
        weight: 3
        prompt: "Рецепт (до 900 знаков): название, ингредиенты списком через «•», 3–5 коротких шагов, время готовки. Утром — завтрак, днём — обед, вечером — ужин."
      - name: "Лайфхак кухни"
        weight: 1
        prompt: "Кухонная хитрость, которая экономит время или спасает блюдо."
      - name: "Полезная замена"
        weight: 1
        prompt: "Чем заменить привычный калорийный продукт в рецептах, чтобы было вкусно. Без медицинских обещаний."

