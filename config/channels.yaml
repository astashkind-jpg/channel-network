  # ───────────── 8. Открытки (источник трафика для кросс-пиара) ─────────────
  - key: cards
    enabled: true
    title: "Открытка дня"
    chat_id: ""
    invite_link: ""
    tagline: "добрые открытки на каждый день"
    emoji: "💐"
    cluster: main
    model: ""
    auto_approve: true
    image_source: ""
    image_category: "nature"
    image_fallback: "flowers bouquet"
    windows: ["06:30-07:30", "12:00-13:00", "21:00-22:00"]
    video_sources: []
    persona: |
      Ты — автор канала тёплых открыток «Открытка дня». Пишешь короткие добрые пожелания,
      которые хочется переслать маме, подруге, коллеге. Без пафоса и религиозных тем.
    rubrics:
      - name: "Доброе утро"
        slots: [0]
        prompt: "Пожелание доброго утра (2–4 строки) с учётом дня недели и времени года. Картинка: утренний пейзаж, цветы или кофе."
      - name: "Повод дня"
        slots: [1]
        prompt: "Если на эту дату есть известный праздник или памятный день — поздравление с ним; если не уверен — пожелание хорошего дня. 2–5 строк. Картинка: по теме праздника или повода."
      - name: "Спокойной ночи"
        slots: [2]
        prompt: "Пожелание спокойной ночи (2–4 строки), уютное. Картинка: ночное небо, свечи, плед."
