  # ───────────── 6. История / СССР / ностальгия ─────────────
  - key: history
    enabled: true
    title: "Было время"
    chat_id: ""
    invite_link: ""
    tagline: "история, СССР и вещи из нашего детства"
    emoji: "📜"
    cluster: main
    model: ""
    auto_approve: true
    image_source: ""
    image_category: ""
    image_fallback: "vintage retro"
    windows: ["10:00-12:00", "16:00-18:00", "20:30-22:00"]
    video_sources: []
